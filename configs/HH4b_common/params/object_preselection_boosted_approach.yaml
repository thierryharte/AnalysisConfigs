object_preselection:
  ## Jet selection
  Jet:
    pt: 15
    eta: 4.7
    jetId: 6 # 6 with lepveto or 2 w/o lepveto
    #TODO: trigger matching?
  FatJetLeading:
    pt: 250
    eta: 2.5
    jetId: 6 # 6 with lepveto or 2 w/o lepveto
    # btagPNetBB: -2
    msd: 50
    # mass_regr_min: 0
    # mass_regr_max: 200
  FatJetSubLeading:
    pt: 250
    eta: 2.5
    jetId: 6 # 6 with lepveto or 2 w/o lepveto
    # btagPNetBB: -2
    msd: 50
    # mass_regr_min: 0
    # mass_regr_max: 200
  
  ## Lepton selection to veto on
  Electron:
    pt: 20
    eta: 2.5
    id: 
      type: cutBased
      working_point: 2 # cut-based ID RunIII Winter22 (0:fail, 1:veto, 2:loose, 3:medium, 4:tight)
    iso:
      type: miniPFRelIso_all
      max_value: 0.4

  Muon:
    pt: 10
    eta: 2.4
    id: looseId
    iso: # 0.15 # 0.3? #DeltaR=0.3
      type: pfRelIso04_all # PFIso ID from miniAOD selector (1=PFIsoVeryLoose, 2=PFIsoLoose, 3=PFIsoMedium, 4=PFIsoTight, 5=PFIsoVeryTight, 6=PFIsoVeryVeryTight)
      max_value: 0.25

  ## Lepton selection to veto on radius for VBFJets
  ElectronRadiusVeto:
    pt: 5

  MuonRadiusVeto:
    pt: 7

  JetBoosted:
    pt: 15
    # gap_pt: 50
    eta: 4.7
    # gap_eta_min: 2.5
    # gap_eta_max: 3.0
    jetId: 6 # 6 with lepveto or 2 w/o lepveto
    # btagPNetB: -2 # 0.2605
    # delta_eta: 3.5
    # mjj: 400
    # dR_to_fatjets and Leptons not yet defined
  ## VBF jet selection
  JetVBF:
    pt: 25
    # gap_pt: 50
    eta: 4.7
    # gap_eta_min: 2.5
    # gap_eta_max: 3.0
    jetId: 6 # 6 with lepveto or 2 w/o lepveto
    # btagPNetB: -2 # 0.2605
    # delta_eta: 3.5
    # mjj: 400
    # dR_to_fatjets and Leptons not yet defined
    dr_jet: 1.2
    clean_jet_coll: "FatJetGoodSelected"
    dr_lep: 0.4
    clean_ele_coll: "Electron"
    clean_mu_coll: "Muon"
    clean_ele_pt: 5
    clean_mu_pt: 7

  JetNearFatJet:
    pt: 25
    # gap_pt: 50
    eta: 2.5
    # gap_eta_min: 2.5
    # gap_eta_max: 3.0
    jetId: 6 # 6 with lepveto or 2 w/o lepveto
    # btagPNetB: -2 # 0.2605
    # delta_eta: 3.5
    # mjj: 400
    # dR_to_fatjets and Leptons not yet defined
    dr_jet: 0.9
    clean_jet_coll: "FatJetGoodSelected"
    dr_lep: 0.4
    clean_ele_coll: "Electron"
    clean_mu_coll: "Muon"
    clean_ele_pt: 5
    clean_mu_pt: 7
